<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Гамбит — тренер дебютов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #eef1ee;
  --surface: #ffffff;
  --surface-2: #e3e8e4;
  --ink: #16203a;
  --muted: #576178;
  --line: #d3d9df;
  --accent: #9a6a12;
  --accent-soft: rgba(154, 106, 18, .14);
  --btn: #16203a;
  --btn-ink: #ffffff;
  --good: #2c7a4b;
  --good-soft: rgba(44, 122, 75, .13);
  --bad: #b93a26;
  --bad-soft: rgba(185, 58, 38, .12);
  --shadow: 0 1px 2px rgba(22, 32, 58, .08), 0 6px 18px rgba(22, 32, 58, .06);
  --serif: 'PT Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1320;
    --surface: #161d2c;
    --surface-2: #1e2738;
    --ink: #e6e9ef;
    --muted: #9aa3b5;
    --line: #2a3446;
    --accent: #d8a547;
    --accent-soft: rgba(216, 165, 71, .16);
    --btn: #d8a547;
    --btn-ink: #161208;
    --good: #5cb883;
    --good-soft: rgba(92, 184, 131, .15);
    --bad: #e46e58;
    --bad-soft: rgba(228, 110, 88, .15);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1320;
  --surface: #161d2c;
  --surface-2: #1e2738;
  --ink: #e6e9ef;
  --muted: #9aa3b5;
  --line: #2a3446;
  --accent: #d8a547;
  --accent-soft: rgba(216, 165, 71, .16);
  --btn: #d8a547;
  --btn-ink: #161208;
  --good: #5cb883;
  --good-soft: rgba(92, 184, 131, .15);
  --bad: #e46e58;
  --bad-soft: rgba(228, 110, 88, .15);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
:root, :root[data-board="wood"] { --sq-l: #ecd6b0; --sq-d: #b3855a; --board-edge: #7d5a3a; }
:root[data-board="slate"] { --sq-l: #dfe5ea; --sq-d: #7f97ae; --board-edge: #4f6377; }
:root[data-board="moss"] { --sq-l: #e6ebd9; --sq-d: #79986d; --board-edge: #4c6444; }
:root { --hl-last: rgba(236, 196, 64, .42); --hl-sel: rgba(80, 140, 230, .45); --hl-dot: rgba(20, 30, 50, .28); }

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--paper);
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* ---------- top-level layout ---------- */
#view { max-width: 1120px; margin: 0 auto; padding: 0 16px 28px; }
body.with-tabs #view { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }

.apphead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin: 0 -16px; padding: 10px 16px; min-height: 56px;
  background: var(--paper);
  border-bottom: 1px solid transparent;
}
.apphead.scrolled { border-bottom-color: var(--line); }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; text-decoration: none; }
.brand svg { width: 30px; height: 30px; }
.brand-name { font-family: var(--serif); font-weight: 700; font-size: 21px; letter-spacing: .01em; }
.icon-btn {
  display: inline-grid; place-items: center; width: 42px; height: 42px; flex: none;
  border: 0; border-radius: 12px; background: transparent; color: var(--ink);
}
.icon-btn:active { background: var(--surface-2); }

.page-title { font-family: var(--serif); font-size: 30px; line-height: 1.15; margin: 14px 0 6px; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 18px; max-width: 60ch; }
h2.sec { font-family: var(--serif); font-size: 20px; margin: 26px 0 10px; font-weight: 700; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border-radius: 12px; text-decoration: none;
  color: var(--muted); font-size: 12.5px; font-weight: 500;
}
.tabbar a.on { color: var(--ink); }
.tabbar a.on svg { stroke: var(--accent); }
.tabbar a .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 15px; }
.tabbar a.on .pill { background: var(--accent-soft); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 15px; text-decoration: none; text-align: center;
}
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.btn.quiet { background: var(--surface-2); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.big { min-height: 52px; font-size: 16px; padding: 12px 20px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }

/* ---------- library ---------- */
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 0 12px; margin-bottom: 12px;
}
.search svg { color: var(--muted); }
.search input { flex: 1; border: 0; background: transparent; padding: 12px 0; outline: none; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 14px; font-weight: 500; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.group-title { display: flex; align-items: baseline; gap: 10px; margin: 24px 0 8px; }
.group-title h2 { font-family: var(--serif); font-size: 19px; margin: 0; }
.group-title span { color: var(--muted); font-size: 14px; }
.op-list { display: grid; gap: 0; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
.op-row {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center;
  padding: 12px 14px; text-decoration: none; border-top: 1px solid var(--line);
}
.op-row:first-child { border-top: 0; }
.op-row:active { background: var(--surface-2); }
.mini { display: block; width: 64px; height: 64px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--board-edge); }
.mini svg { display: block; width: 100%; height: 100%; }
.ml { fill: var(--sq-l); } .md { fill: var(--sq-d); }
.op-name { display: block; font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.25; }
.op-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 3px; font-size: 13.5px; color: var(--muted); }
.side { display: inline-flex; align-items: center; gap: 5px; }
.side::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #7b8190; }
.side.w::before { background: #f7f5ef; }
.side.b::before { background: #1c1f26; }
.dots { display: flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots i.half { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
.dots i.full { background: var(--accent); border-color: var(--accent); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- opening page ---------- */
.subhead { display: flex; align-items: center; gap: 6px; margin: 0 -16px; padding: 8px 10px; min-height: 56px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); }
.subhead .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-hero { display: grid; gap: 16px; margin-top: 4px; }
.op-hero .mini { width: 100%; max-width: 230px; height: auto; aspect-ratio: 1; border-radius: 10px; margin: 0 auto; }
.op-kind { color: var(--muted); font-size: 14px; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.op-title { font-family: var(--serif); font-size: 30px; line-height: 1.12; margin: 0 0 10px; }
.op-desc { margin: 0; max-width: 62ch; }
.ideas { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.ideas li { position: relative; padding-left: 22px; max-width: 64ch; }
.ideas li::before { content: ""; position: absolute; left: 4px; top: .6em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--accent); }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.line-item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.li-name { font-weight: 600; font-size: 16.5px; }
.li-moves { font-size: 13.5px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.li-meta { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 13.5px; color: var(--muted); }
.stars { color: var(--accent); letter-spacing: 2px; font-size: 15px; }
.stars .off { color: var(--line); }
.li-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cta-col { display: grid; gap: 10px; margin-top: 22px; }

/* ---------- train page ---------- */
.prog-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.prog-num { font-family: var(--serif); font-size: 34px; font-weight: 700; line-height: 1; }
.prog-num small { font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 12px 0 10px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.prog-note { margin: 0; color: var(--muted); font-size: 14px; }
.quick { display: grid; gap: 10px; margin-top: 14px; }
.q-item {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  text-decoration: none;
}
.q-item[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.q-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }
.q-ico svg { width: 30px; height: 30px; }
.q-title { font-weight: 600; display: block; }
.q-sub { font-size: 13.5px; color: var(--muted); display: block; margin-top: 2px; }
.recent { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.recent li + li { border-top: 1px solid var(--line); }
.recent a { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; text-decoration: none; }
.recent .r1 { font-weight: 600; }
.recent .r2 { font-size: 13.5px; color: var(--muted); grid-column: 1; }
.recent .stars { grid-row: 1 / span 2; grid-column: 2; align-self: center; }

/* ---------- play setup ---------- */
.resume { display: grid; gap: 12px; background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; }
.resume p { margin: 0; }
.field { margin-top: 20px; }
.flabel { display: block; font-weight: 600; margin-bottom: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 10px 6px; border-radius: 10px; font-weight: 500; font-size: 15px; min-height: 42px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lvl { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 4px; }
.lvl[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.lvl-name { font-weight: 600; }
.lvl-desc { font-size: 13px; color: var(--muted); line-height: 1.35; }
.meter { display: flex; gap: 3px; margin-top: 4px; }
.meter i { width: 14px; height: 4px; border-radius: 2px; background: var(--surface-2); }
.meter i.on { background: var(--accent); }
select.sel { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-height: 48px; }
.hint { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
.stats-line { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14.5px; }
.stats-line b { color: var(--ink); font-family: var(--serif); font-size: 20px; margin-right: 4px; }

/* ---------- board screen ---------- */
.bscreen { margin: 0 -16px; }
.bhead {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 4px; padding: 6px 6px; min-height: 54px; background: var(--paper);
}
.btitle { flex: 1; min-width: 0; text-align: center; }
.btitle h1 { margin: 0; font-family: var(--serif); font-size: 17.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btitle p { margin: 1px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blayout { display: grid; gap: 10px; padding: 0 8px; }
.bcol { --bsize: max(240px, min(calc(100vw - 16px), 560px, calc(100vh - 290px))); }
@supports (height: 100dvh) { .bcol { --bsize: max(240px, min(calc(100vw - 16px), 560px, calc(100dvh - 290px))); } }
.bcol { width: var(--bsize); margin: 0 auto; }
.pbar { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 2px 2px; font-size: 14px; }
.pname { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.pname::before { content: ""; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #7b8190; }
.pname.w::before { background: #f7f5ef; } .pname.b::before { background: #1c1f26; }
.pname.turn::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.pcap { margin-left: auto; display: flex; align-items: center; gap: 0; color: var(--muted); font-size: 13px; }
.pcap svg { width: 18px; height: 18px; margin-left: -4px; }
.pcap b { margin-left: 4px; font-weight: 600; }

.scol { display: grid; gap: 10px; align-content: start; width: 100%; max-width: 560px; margin: 0 auto; }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-height: 84px; }
.note p { margin: 0; }
.note .n-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
.note .n-head .bar { flex: 1; margin: 0; height: 5px; }
.n-entry + .n-entry { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.n-move { font-family: var(--serif); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.n-text { margin-top: 3px; max-width: 62ch; }
.n-prompt { margin-top: 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.n-prompt.you::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.tag { font-family: var(--sans); font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.opp { background: var(--surface-2); color: var(--muted); }
.n-mistake { color: var(--bad); font-weight: 600; }
.n-title { font-family: var(--serif); font-weight: 700; font-size: 19px; }
.n-sub { color: var(--muted); margin-top: 4px; }
.thinking::after { content: "…"; display: inline-block; animation: blink 1.2s steps(4) infinite; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes blink { 0% { width: 0; } 100% { width: 1.2em; } }
.done-box { display: grid; gap: 6px; }
.done-box .stars { font-size: 22px; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.ctrls .btn { flex: 1 1 auto; min-width: 0; padding: 8px 10px; }
.ctrls .grow { flex: 1 1 100%; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1 1 100%; }
.nav .btn { padding: 8px 0; }
.ctl-btn { display: inline-flex; flex-direction: column; gap: 2px; font-size: 12.5px; font-weight: 500; }

.sheet-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.sheet { position: relative; max-height: 180px; overflow-y: auto; padding: 4px 0; font-variant-numeric: tabular-nums; }
.srow { display: grid; grid-template-columns: 44px 1fr 1fr; align-items: center; }
.srow:nth-child(even) { background: var(--surface-2); }
.sn { color: var(--muted); font-size: 13px; text-align: right; padding-right: 12px; }
.sm { border: 0; background: transparent; text-align: left; padding: 6px 8px; font-size: 15px; border-radius: 6px; min-height: 32px; }
.sm.cur { background: var(--accent-soft); font-weight: 700; }
.sm:disabled { cursor: default; }
.sheet-empty { color: var(--muted); padding: 10px 14px; font-size: 14px; }

/* ---------- board ---------- */
.board {
  position: relative; width: var(--bsize); height: var(--bsize);
  border-radius: 6px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  box-shadow: 0 0 0 1px var(--board-edge), var(--shadow);
}
.sqs { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
.sq { position: relative; }
.sq.l { background-color: var(--sq-l); } .sq.d { background-color: var(--sq-d); }
.sq::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.sq.last::before { background: var(--hl-last); }
.sq.sel::before { background: var(--hl-sel); }
.sq.m-good::before { background: rgba(46, 160, 90, .5); }
.sq.m-bad::before { background: rgba(214, 52, 40, .55); }
.sq.m-hint { box-shadow: inset 0 0 0 4px #e0a32e; }
.sq.chk { background-image: radial-gradient(circle, rgba(225, 40, 30, .9) 0%, rgba(225, 40, 30, .45) 38%, rgba(225, 40, 30, 0) 70%); }
.sq.tgt::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--hl-dot); z-index: 3; pointer-events: none; }
.sq.cap::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, transparent 62%, var(--hl-dot) 64%); z-index: 3; pointer-events: none; }
.pw { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; }
.sq.anim { z-index: 5; }
.pc { width: 88%; height: 88%; pointer-events: none; }
.sq.lift .pw { opacity: .28; }
.coord { position: absolute; z-index: 1; font-size: clamp(8.5px, 2.4vw, 12px); font-weight: 600; line-height: 1; pointer-events: none; }
.coord.f { right: 5%; bottom: 4%; }
.coord.r { left: 5%; top: 5%; }
.sq.l .coord { color: var(--sq-d); } .sq.d .coord { color: var(--sq-l); }

function pieceSymbol(color, type) {
  var sh = PIECE_SHAPES[type];
  var fill = color === 'w' ? '#fbf8f1' : '#2a2c33';
  var out = color === 'w' ? '#1f2228' : '#0e0f12';
  var det = color === 'w' ? '#1f2228' : '#cfc9bb';
  return '<g fill="' + out + '" stroke="' + out + '" stroke-width="7" stroke-linejoin="round">' + sh.s + '</g>' +
    '<g fill="' + fill + '">' + sh.s + '</g>' +
    (sh.d ? '<g fill="none" stroke="' + det + '" stroke-width="3" stroke-linecap="round">' + sh.d.replace(/class="dot"/g, 'fill="' + det + '" stroke="none"') + '</g>' : '');
}

      var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
      var a = b.getAttribute('data-a');
      if (a === 'hint') {
        if (pos.side !== user || done) return;
        hintStage = Math.min(2, hintStage + 1); hints++;
        showHint(hintStage);
        var ex = expected();
        renderNote(hintStage === 1 ? 'Подсказка: ходит отмеченная фигура.' : 'Ход по теории: ' + esc(ru(ex.san)) + '. Сделайте его на доске.');
        renderCtrls();
      } else if (a === 'restart' || a === 'again') begin(line);
      else if (a === 'next') {
        if (fixed) { var others = op.lines.filter(function (l) { return l !== fixed; }); go('drill-' + op.id + '-' + rand(others).idx); }
        else begin(pickLine(line.key));
      }
      else if (a === 'reset') { sessionDone = {}; begin(pickLine(line.key)); }
      else if (a === 'bot') startGame({ ucis: path.slice(), user: user, level: settings.level, label: line.op.name });
      else if (a === 'study') go('study-' + line.op.id + '-' + line.idx);
    });
    begin();
    return S;
  }

  /* ================= game ================= */
  function loadGame() { return store.get('gt-game', null); }
  function saveGame(G) { store.set('gt-game', G); }
  function startGame(cfg) {
    var G = { ucis: cfg.ucis || [], user: cfg.user, level: cfg.level, label: cfg.label || '', startLen: (cfg.ucis || []).length, over: null, recorded: false };
    saveGame(G);
    go('game');
  }
  var REASON = { mate: 'Мат', stalemate: 'Пат', fifty: 'Правило 50 ходов', repetition: 'Троекратное повторение', material: 'Недостаточно материала', resign: 'Вы сдались' };
  function GameScreen() {
    var G = loadGame();
    if (!G) { go('play'); return null; }
    var S = makeLife(), L = LEVELS[G.level] || LEVELS[2];
    var ui = mountBoardScreen({ title: 'Игра с ботом', sub: 'Бот: ' + L.name + (G.label ? '. Старт: ' + G.label : ''), back: 'play' });
    ui.names = G.user === 0 ? ['Вы', 'Бот'] : ['Бот', 'Вы'];
    var pos = new E.Position(), sans = [];
    G.ucis.forEach(function (u) { var m = pos.parseUci(u); if (m) { sans.push(pos.san(m)); pos.make(m); } });
    G.ucis = G.ucis.slice(0, sans.length);
    var viewPly = null, thinking = false, token = 0, hint = null, lastMv = null, opening = detectOpening(G.ucis, sans);
    if (G.ucis.length) lastMv = uciSquares(G.ucis[G.ucis.length - 1]);
    ui.board.orient = G.user;

    function resultText() {
      var o = G.over; if (!o) return '';
      var head;
      if (o.reason === 'resign') head = 'Победил бот';
      else if (o.result === '1/2-1/2') head = 'Ничья';
      else head = ((o.result === '1-0' ? 0 : 1) === G.user) ? 'Вы победили!' : 'Победил бот';
      return { head: head, why: REASON[o.reason] || '' };
    }
    function canUndo() {
      if (thinking) return false;
      for (var k = G.startLen; k < G.ucis.length; k++) if (k % 2 === G.user) return true;
      return false;
    }
    function render(anim) {
      var b = ui.board, live = viewPly === null;
      var shown = live ? pos : posFrom(G.ucis, viewPly);
      b.pos = shown; b.sel = -1; b.marks = {};
      b.last = live ? lastMv : (viewPly ? uciSquares(G.ucis[viewPly - 1]) : null);
      b.arrows = live && hint ? [{ from: hint[0], to: hint[1], color: 'rgba(46,150,90,.85)' }] : [];
      b.setMovable(live && !G.over && !thinking && pos.side === G.user ? pos.legalMoves() : null);
      b.draw({ anim: anim }); updateBars(ui);
      var n = '';
      if (opening) n += '<p class="n-sub" style="margin:0 0 6px">Дебют: ' + esc(opening) + '</p>';
      if (!live) {
        n += '<p class="n-title">Просмотр позиции</p><p class="n-sub">' + (viewPly ? 'После хода ' + esc(moveLabel(viewPly - 1, sans[viewPly - 1])) : 'Начальная позиция') + '. Партия ждёт вас.</p>';
      } else if (G.over) {
        var r = resultText();
        n += '<p class="n-title">' + r.head + '</p><p class="n-sub">' + r.why + '</p>';
      } else if (thinking) {
        n += '<p class="n-prompt thinking">Бот думает</p>';
      } else {
        if (sans.length) n += '<p class="n-move">' + esc(moveLabel(sans.length - 1, sans[sans.length - 1])) + '</p>';
        if (hint && hint.text) n += '<p class="n-text">Подсказка: ' + esc(hint.text) + '</p>';
        n += '<p class="n-prompt you">' + (pos.inCheck() ? 'Шах! Ваш ход' : 'Ваш ход') + '</p>';
      }
      ui.note.innerHTML = n;
      var cur = live ? sans.length : viewPly, c = navBtns(cur, sans.length);
      if (!live) c += btn('live', ICON.play, 'Вернуться к партии', 'primary grow');
      else if (G.over) c += btn('again', ICON.restart, 'Сыграть ещё', 'primary') + btn('setup', ICON.sliders, 'Новые настройки') + (canUndo() ? btn('undo', ICON.undo, 'Ход назад', 'quiet grow') : '');
      else c += btn('hint', ICON.bulb, 'Подсказка', '', thinking || pos.side !== G.user) + btn('undo', ICON.undo, 'Ход назад', '', !canUndo()) + btn('resign', ICON.flag, 'Сдаться', 'quiet');
      ui.ctrls.innerHTML = c;
      renderSheet(ui, sans, cur, true, function (p) { viewPly = p >= sans.length ? null : p; render(); });
    }
    function recordResult() {
      if (G.recorded || !G.over) return;
      var o = G.over, k;
      if (o.reason === 'resign') k = 'loss';
      else if (o.result === '1/2-1/2') k = 'draw';
      else k = ((o.result === '1-0' ? 0 : 1) === G.user) ? 'win' : 'loss';
      stats[k]++; store.set('gt-stats', stats); G.recorded = true;
    }
    function play(m, info) {
      var san = pos.san(m), u = pos.uci(m), cap = isCapture(pos, m), anim = (info && info.dragged) ? null : moveAnim(m);
      pos.make(m); G.ucis.push(u); sans.push(san);
      lastMv = [E.mFrom(m), E.mTo(m)]; hint = null; viewPly = null;
      var d = detectOpening(G.ucis, sans); if (d) opening = d;
      var st = pos.status();
      if (st.over) { G.over = st; recordResult(); }
      saveGame(G);
      moveSound(pos, cap);
      if (G.over) S.later(function () { sfx('done'); }, 250);
      if (!G.over && pos.side !== G.user) botTurn(anim);
      else render(anim);
    }
    function botTurn(anim) {
      thinking = true; var my = ++token, t0 = Date.now();
      render(anim);
      function apply(u) {
        if (!S.alive || my !== token) return;
        S.later(function () {
          if (my !== token) return;
          thinking = false;
          var m = u && pos.parseUci(u);
          if (!m) { var lm = pos.legalMoves(); m = lm.length ? rand(lm) : 0; }
          if (m) play(m); else render();
        }, Math.max(0, 450 - (Date.now() - t0)));
      }
      var bk = pickBook(G.ucis, G.level);
      if (bk) { apply(bk); return; }
      Bot.think(G.ucis, L.opts).then(function (r) { apply(r.uci); });
    }
    ui.board.onMove = function (m, info) {
      if (thinking || G.over || viewPly !== null || pos.side !== G.user) return;
      play(m, info);
    };
    function undo() {
      if (!canUndo()) return;
      token++; thinking = false;
      while (G.ucis.length > G.startLen) {
        var k = G.ucis.length - 1;
        pos.unmake(); G.ucis.pop(); sans.pop();
        if (k % 2 === G.user) break;
      }
      G.over = null; hint = null; viewPly = null;
      lastMv = G.ucis.length ? uciSquares(G.ucis[G.ucis.length - 1]) : null;
      opening = detectOpening(G.ucis, sans) || opening;
      saveGame(G); render();
    }
    ui.ctrls.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
      var a = b.getAttribute('data-a'), len = sans.length, cur = viewPly === null ? len : viewPly;
      if (a === 'first') { viewPly = 0; render(); }
      else if (a === 'prev') { viewPly = Math.max(0, cur - 1); render(); }
      else if (a === 'next') { var nx = cur + 1; viewPly = nx >= len ? null : nx; render(); }
      else if (a === 'last' || a === 'live') { viewPly = null; render(); }
      else if (a === 'undo') undo();
      else if (a === 'hint') {
        if (thinking || pos.side !== G.user) return;
        var my = token;
        ui.note.innerHTML = '<p class="n-prompt thinking">Ищу лучший ход</p>';
        Bot.think(G.ucis, { time: 900 }).then(function (r) {
          if (!S.alive || my !== token || !r.uci) { render(); return; }
          var m = pos.parseUci(r.uci); if (!m) { render(); return; }
          hint = uciSquares(r.uci); hint.text = ru(pos.san(m));
          render();
        });
      }
      else if (a === 'resign') {
        confirmBox('Сдать партию?', 'Партия будет засчитана как поражение.', 'Сдаться', function () {
          G.over = { over: true, result: G.user === 0 ? '0-1' : '1-0', reason: 'resign' }; recordResult(); saveGame(G); render();
        });
      }
      else if (a === 'again') {
        var line0 = G.startLen ? G.ucis.slice(0, G.startLen) : [];
        startGame({ ucis: line0, user: G.user, level: G.level, label: G.label });
      }
      else if (a === 'setup') go('play');
    });
    S.onKeys(function (e) {
      if (e.key === 'ArrowLeft') { var c = viewPly === null ? sans.length : viewPly; viewPly = Math.max(0, c - 1); render(); }
      else if (e.key === 'ArrowRight' && viewPly !== null) { viewPly = viewPly + 1 >= sans.length ? null : viewPly + 1; render(); }
    });
    var baseDestroy = S.destroy;
    S.destroy = function () { token++; baseDestroy(); };
    if (!G.over && pos.side !== G.user) botTurn(); else render();
    return S;
  }

  /* ================= training hub ================= */
  function viewTrain() {
    setTabs('train');
    var total = ALL_LINES.length, mast = masteredCount(), rev = reviewPool();
    var wN = ALL_LINES.filter(function (l) { return l.op.side === 'w'; }).length, bN = total - wN;
    var recent = ALL_LINES.filter(function (l) { return lp(l.key).t; }).sort(function (a, b) { return lp(b.key).t - lp(a.key).t; }).slice(0, 6);
    var html = appHead() + '<h1 class="page-title">Тренировка</h1><p class="lead">Короткие сессии каждый день запоминаются лучше, чем одна длинная.</p>' +
      '<div class="prog-card"><div class="prog-num">' + mast + '<small>из ' + total + ' ' + plural(total, ['варианта', 'вариантов', 'вариантов']) + ' освоено</small></div>' +
      '<div class="bar"><i style="width:' + (total ? Math.round(mast / total * 100) : 0) + '%"></i></div>' +
      '<p class="prog-note">Вариант считается освоенным после трёх прохождений без ошибок и подсказок.</p></div>' +
      '<div class="quick">' +
      qItem('#drill-mix-w', pieceSvg('wn', ''), 'Случайный вариант за белых', wN + ' ' + plural(wN, ['вариант', 'варианта', 'вариантов']) + ', сначала неосвоенные') +
      qItem('#drill-mix-b', pieceSvg('bn', ''), 'Случайный вариант за чёрных', bN + ' ' + plural(bN, ['вариант', 'варианта', 'вариантов']) + ', сначала неосвоенные') +
      qItem('#drill-mix-all', '<span style="color:var(--accent)">' + ICON.shuffle + '</span>', 'Все дебюты вперемешку', 'Белыми и чёрными по очереди') +
      qItem('#drill-review', '<span style="color:var(--bad)">' + ICON.repeat + '</span>', 'Работа над ошибками', rev.length ? rev.length + ' ' + plural(rev.length, ['вариант требует', 'варианта требуют', 'вариантов требуют']) + ' повторения' : 'Пока нечего повторять — сначала потренируйтесь', !rev.length) +
      '</div>';
    html += '<h2 class="sec">Недавние</h2>';
    if (recent.length) {
      html += '<ul class="recent">' + recent.map(function (l) {
        var p = lp(l.key);
        return '<li><a href="#drill-' + l.op.id + '-' + l.idx + '"><span class="r1">' + esc(l.op.name) + '</span><span class="r2">' + esc(l.name) + (p.e ? ', ошибок в последний раз: ' + p.e : ', в последний раз без ошибок') + '</span>' + starsHtml(starsOf(l.key)) + '</a></li>';
      }).join('') + '</ul>';
    } else html += '<p class="empty" style="text-align:left;padding:0">Здесь появятся варианты, которые вы тренировали. Начните с любой карточки выше или выберите дебют в разделе «Дебюты».</p>';
    view.innerHTML = html;
  }
  function qItem(href, ico, title, sub, disabled) {
    return '<a class="q-item" href="' + href + '"' + (disabled ? ' aria-disabled="true" tabindex="-1"' : '') + '><span class="q-ico">' + ico + '</span><span><span class="q-title">' + title + '</span><span class="q-sub">' + sub + '</span></span>' + ICON.next + '</a>';
  }

  /* ================= play setup ================= */
  function viewPlay() {
    setTabs('play');
    var G = loadGame(), html = appHead() + '<h1 class="page-title">Игра с ботом</h1><p class="lead">Отрабатывайте выученные дебюты в живой партии или просто играйте.</p>';
    if (G && !G.over && G.ucis.length > G.startLen) {
      var lv = LEVELS[G.level] || LEVELS[2];
      html += '<div class="resume"><p>Незаконченная партия: ' + Math.ceil(G.ucis.length / 2) + '-й ход, вы играете ' + (G.user === 0 ? 'белыми' : 'чёрными') + ', бот «' + lv.name + '».</p><a class="btn primary" href="#game">' + ICON.play + 'Продолжить партию</a></div>';
    }
    html += '<div class="field"><span class="flabel" id="lc">Ваш цвет</span><div class="seg" role="group" aria-labelledby="lc" id="color">' +
      [['w', 'Белые'], ['r', 'Случайно'], ['b', 'Чёрные']].map(function (c) { return '<button type="button" data-v="' + c[0] + '" aria-pressed="' + (settings.color === c[0]) + '">' + c[1] + '</button>'; }).join('') + '</div></div>';
    html += '<div class="field"><span class="flabel" id="ll">Сила бота</span><div class="levels" role="group" aria-labelledby="ll" id="lvls">' + LEVELS.map(function (l, i) {
      var meter = ''; for (var k = 0; k < 6; k++) meter += '<i class="' + (k <= i ? 'on' : '') + '"></i>';
      return '<button type="button" class="lvl" data-v="' + i + '" aria-pressed="' + (settings.level === i) + '"><span class="lvl-name">' + l.name + '</span><span class="lvl-desc">' + l.desc + '</span><span class="meter">' + meter + '</span></button>';
    }).join('') + '</div></div>';
    var opts = '<option value="">Обычная начальная позиция</option>';
    GROUPS.forEach(function (g) {
      var ls = ALL_LINES.filter(function (l) { return groupOf(l.op) === g[0]; });
      opts += '<optgroup label="' + g[1] + '">' + ls.map(function (l) { return '<option value="' + l.key + '"' + (settings.start === l.key ? ' selected' : '') + '>' + esc(l.op.name + ': ' + l.name) + '</option>'; }).join('') + '</optgroup>';
    });
    html += '<div class="field"><label class="flabel" for="start">Начальная позиция</label><select class="sel" id="start">' + opts + '</select><p class="hint">Партия начнётся после последнего хода выбранного варианта — так удобно отрабатывать дебют.</p></div>' +
      '<div class="field"><button class="btn primary big full" type="button" id="go">' + ICON.play + 'Начать партию</button></div>' +
      '<h2 class="sec">Ваши результаты</h2><div class="stats-line"><span><b>' + stats.win + '</b>' + plural(stats.win, ['победа', 'победы', 'побед']) + '</span><span><b>' + stats.draw + '</b>' + plural(stats.draw, ['ничья', 'ничьи', 'ничьих']) + '</span><span><b>' + stats.loss + '</b>' + plural(stats.loss, ['поражение', 'поражения', 'поражений']) + '</span></div>';
    view.innerHTML = html;
    view.querySelector('#color').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      settings.color = b.getAttribute('data-v'); saveSettings();
      Array.prototype.forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
    };
    view.querySelector('#lvls').onclick = function (e) {
      var b = e.target.closest('.lvl'); if (!b) return;
      settings.level = +b.getAttribute('data-v'); saveSettings();
      Array.prototype.forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
    };
    view.querySelector('#start').onchange = function () { settings.start = this.value; saveSettings(); };

      var user = settings.color === 'r' ? (Math.random() < 0.5 ? 0 : 1) : settings.color === 'w' ? 0 : 1;
      var ln = settings.start && LINE_BY_KEY[settings.start];
      startGame({ ucis: ln ? ln.ucis.slice() : [], user: user, level: settings.level, label: ln ? ln.op.name : '' });
    };
  }

  /* ================= modals ================= */
  var modalEl = null;
  function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
  function openModal(inner, cls) {
    closeModal();
    modalEl = document.createElement('div');
    modalEl.className = 'modal';
    modalEl.innerHTML = '<div class="modal-card ' + (cls || '') + '" role="dialog" aria-modal="true">' + inner + '</div>';
    modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });
    document.body.appendChild(modalEl);
    var f = modalEl.querySelector('button'); if (f) f.focus({ preventScroll: true });
    return modalEl;
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  function confirmBox(title, text, okLabel, onOk) {
    var m = openModal('<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><div class="modal-actions"><button class="btn primary" type="button" data-c="ok">' + esc(okLabel) + '</button><button class="btn quiet" type="button" data-c="no">Отмена</button></div>', 'confirm-card');
    m.querySelector('[data-c="ok"]').onclick = function () { closeModal(); onOk(); };
    m.querySelector('[data-c="no"]').onclick = closeModal;
  }
  var BOARDS = [['wood', 'Дерево', '#ecd6b0', '#b3855a'], ['slate', 'Сланец', '#dfe5ea', '#7f97ae'], ['moss', 'Мох', '#e6ebd9', '#79986d']];
  function openSettings() {
    function sw(b) { return '<span class="sw"><i style="background:' + b[2] + '"></i><i style="background:' + b[3] + '"></i><i style="background:' + b[3] + '"></i><i style="background:' + b[2] + '"></i></span>'; }
    var html = '<h2>Настройки</h2>' +
      '<div class="field"><span class="flabel">Доска</span><div class="swatches" id="sb">' + BOARDS.map(function (b) { return '<button type="button" class="swatch" data-v="' + b[0] + '" aria-pressed="' + (settings.board === b[0]) + '">' + sw(b) + b[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><span class="flabel">Оформление</span><div class="seg" id="st">' + [['auto', 'Как в системе'], ['light', 'Светлое'], ['dark', 'Тёмное']].map(function (t) { return '<button type="button" data-v="' + t[0] + '" aria-pressed="' + (settings.theme === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div></div>' +
      '<div class="field">' +
      '<label class="switch">Звук ходов<input type="checkbox" data-k="sound"' + (settings.sound ? ' checked' : '') + '></label>' +
      '<label class="switch">Координаты на доске<input type="checkbox" data-k="coords"' + (settings.coords ? ' checked' : '') + '></label>' +
      '<label class="switch">Показывать возможные ходы<input type="checkbox" data-k="legal"' + (settings.legal ? ' checked' : '') + '></label></div>' +
      '<div class="install"><b>Как установить на телефон</b><p>Откройте страницу в Chrome на Android, нажмите меню ⋮ и выберите «Добавить на главный экран». Приложение появится рядом с остальными. Прогресс хранится на этом устройстве.</p></div>' +
      '<div class="modal-actions"><button class="btn primary" type="button" data-c="close">Готово</button><button class="btn quiet danger" type="button" data-c="reset">Сбросить прогресс</button></div>';
    var m = openModal(html);
    m.querySelector('#sb').onclick = function (e) {
      var b = e.target.closest('.swatch'); if (!b) return;
      settings.board = b.getAttribute('data-v'); saveSettings();
      Array.prototype.forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
    };
    m.querySelector('#st').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      settings.theme = b.getAttribute('data-v'); saveSettings();
      Array.prototype.forEach.call(this.children, function (c) { c.setAttribute('aria-pressed', c === b); });
    };
    Array.prototype.forEach.call(m.querySelectorAll('input[data-k]'), function (inp) {
      inp.onchange = function () { settings[inp.getAttribute('data-k')] = inp.checked; saveSettings(); refreshBoards(); };
    });
    m.querySelector('[data-c="close"]').onclick = closeModal;
    m.querySelector('[data-c="reset"]').onclick = function () {
      confirmBox('Сбросить прогресс?', 'Звёзды, история тренировок и счёт партий будут удалены с этого устройства.', 'Сбросить', function () {
        progress = {}; stats = { win: 0, loss: 0, draw: 0 };
        store.del('gt-progress'); store.del('gt-stats');
        route();
      });
    };
  }
  var activeBoard = null;
  function refreshBoards() { if (activeBoard && document.body.contains(activeBoard.el)) activeBoard.draw(); }

  /* ================= start ================= */
  tabbar.innerHTML = [['openings', 'Дебюты', ICON.book], ['train', 'Тренировка', ICON.target], ['play', 'Игра', ICON.pawn]]
    .map(function (t) { return '<a href="#' + t[0] + '" data-tab="' + t[0] + '"><span class="pill">' + t[2] + '</span>' + t[1] + '</a>'; }).join('');
  route();
})();

</script>
